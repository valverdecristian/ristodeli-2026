<div class="logo-wrapper fade-in">
  <img src="assets/icon/favicon.ico" class="spin-logo" alt="Logo Ristodeli" />
</div>

<div class="actions-grid">
  @for (act of visibleActions; track act.action) {
    <div class="action-card ion-activatable" 
        [style.background-color]="act.color" 
        (click)="handleAction(act.action)">
      <div class="icon-container">
        <ion-icon [name]="act.icon"></ion-icon>
      </div>
      <span class="action-title">{{ act.title }}</span>
      <ion-ripple-effect></ion-ripple-effect>
    </div>
  }
</div>
