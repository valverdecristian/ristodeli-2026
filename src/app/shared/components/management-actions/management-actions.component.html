<div class="actions-grid">
  <div class="action-card ion-activatable" *ngFor="let act of actions" [style.--bg-color]="act.color" (click)="handleAction(act.action)">
    <div class="icon-container">
      <ion-icon [name]="act.icon"></ion-icon>
    </div>
    <span class="action-title">{{ act.title }}</span>
    <ion-ripple-effect></ion-ripple-effect>
  </div>
</div>
