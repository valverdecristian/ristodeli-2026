<ion-content [fullscreen]="true">

  <div class="login-container">
   
    <div class="logo-section">
      <img src="assets/icon/favicon.ico" alt="Logo" class="logo" />
    </div>

  
    <div class="form-section">
      <form (ngSubmit)="login()">

        <ion-item class="input-item">
          <ion-input
            type="email"
            placeholder="Correo Electrónico"
            [(ngModel)]="email"
            name="email"
            required>
          </ion-input>
        </ion-item>

        <ion-item class="input-item">
          <ion-input
            type="password"
            placeholder="Contraseña"
            [(ngModel)]="password"
            name="password"
            required>
          </ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" class="login-button">
          Iniciar sesión
        </ion-button>

      </form>
    </div>

  </div>

</ion-content>
