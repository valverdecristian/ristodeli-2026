<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-title>🤵 Gestión de Salón</ion-title>
    
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content color="light" class="ion-padding">
  
  <p class="ion-text-center" style="color: gray;">Toca una mesa para cambiar su estado.</p>

  <ion-grid>
    <ion-row>
      <ion-col size="6" size-md="3" *ngFor="let mesa of mesas">
        
        <ion-card class="mesa-card" [color]="mesa.estado === 'Ocupada' ? 'danger' : 'success'">
          <ion-card-header class="ion-text-center">
            <ion-card-title style="font-size: 2rem;">{{ mesa.numero }}</ion-card-title>
            <ion-card-subtitle>{{ mesa.comensales }} comensales</ion-card-subtitle>
          </ion-card-header>
          
          <ion-card-content class="ion-text-center">
            <strong>{{ mesa.estado || 'Libre' }}</strong>
            
            <div class="ion-margin-top">
              <ion-button fill="outline" color="light" size="small"
                          *ngIf="mesa.estado !== 'Ocupada'" 
                          (click)="ocuparMesa(mesa)">
                Ocupar
              </ion-button>
              
              <ion-button fill="outline" color="light" size="small"
                          *ngIf="mesa.estado === 'Ocupada'" 
                          (click)="liberarMesa(mesa)">
                Liberar
              </ion-button>
            </div>
          </ion-card-content>
        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
