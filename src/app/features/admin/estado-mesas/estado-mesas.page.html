<ion-header class="ion-no-border">
  <ion-toolbar color="warning">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home-metre" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title class="text-russet title-bold">GESTIÓN DE ESTADOS</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="risto-background">
  <ion-grid class="ion-padding">
    <ion-row>
      @for (mesa of mesas; track mesa.id) {
        <ion-col size="6">
          <ion-card class="mesa-card-operativa" (click)="toggleEstado(mesa)">
            <div class="foto-mesa">
              <img [src]="mesa.foto || 'assets/icon/favicon.ico'" alt="Mesa">
              <div class="estado-badge" [ngClass]="mesa.estado?.toLowerCase() || 'libre'">
                {{ mesa.estado || 'LIBRE' }}
              </div>
            </div>

            <ion-card-header>
              <ion-card-title class="numero">MESA {{ mesa.numero }}</ion-card-title>
              <ion-card-subtitle class="pax">
                <ion-icon name="people-outline"></ion-icon>
                {{ mesa.comensales }} COMENSALES
              </ion-card-subtitle>
            </ion-card-header>
          </ion-card>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
</ion-content>
