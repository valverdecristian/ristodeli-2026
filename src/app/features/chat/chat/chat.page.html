<ion-header>
  <ion-toolbar color="warning">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backUrl"></ion-back-button>
    </ion-buttons>
    <ion-title>Mesa {{ mesaId }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-no-padding">
  <div class="chat-wrapper">
    <div class="chat-container" #chatScroll>
      @for (msj of mensajes(); track msj.created_at) {
        <div class="mensaje fade-in" [ngClass]="{ 'mensaje-propio': esMensajePropio(msj) }">
          <div class="burbuja">
            <div class="usuario">👤 {{ getNombreRemitente(msj) }}</div>
            <div class="texto">{{ msj.mensaje }}</div>
            <div class="fecha">{{ msj.created_at | date : 'dd/MM/yyyy HH:mm' }}</div>
          </div>
        </div>
      }
    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <div class="input-wrapper">
      <input type="text" [ngModel]="mensajeTexto()" (ngModelChange)="mensajeTexto.set($event)"
          placeholder="Escribe tu mensaje..." class="input-chat" (keyup.enter)="enviarMensaje()" />
      <button class="button" (click)="enviarMensaje()">
          <ion-icon name="send"></ion-icon>
      </button>
    </div>
  </ion-toolbar>
</ion-footer>
