<ion-header>
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Agregar Bebida</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <p class="instrucciones ion-text-center">
    Complete los datos. Recuerde tomar <strong>3 fotos</strong> en el momento.
  </p>

  <ion-list class="formulario-lista">
    
    <ion-item class="input-item" lines="full">
      <ion-input label="Nombre de la Bebida *" labelPlacement="floating" [(ngModel)]="bebida.nombre"></ion-input>
    </ion-item>

    <ion-item class="input-item" lines="full">
      <ion-textarea label="Descripción *" labelPlacement="floating" [(ngModel)]="bebida.descripcion" rows="2"></ion-textarea>
    </ion-item>

    <ion-row>
      <ion-col size="6">
        <ion-item class="input-item" lines="full">
          <ion-input type="number" label="Prep. (Min) *" labelPlacement="floating" [(ngModel)]="bebida.tiempo_elaboracion" min="0"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="6">
        <ion-item class="input-item" lines="full">
          <ion-input type="number" 
                     label="Precio ($) *" 
                     labelPlacement="floating" 
                     [(ngModel)]="bebida.precio"
                     (ionInput)="validarDecimales($event)"
                     step="0.01">
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

  </ion-list>

  <div class="seccion-fotos">
    <h3 class="ion-text-center">Evidencias ({{ fotosPreview.length }}/3)</h3>
    
    <ion-button expand="block" size="large" color="light" class="btn-foto" (click)="tomarFoto()" [disabled]="fotosPreview.length >= 3">
      📸 CAPTURAR FOTO
    </ion-button>

    @if (fotosPreview.length > 0) {
      <ion-grid>
        <ion-row>
          @for (foto of fotosPreview; track $index) {
            <ion-col size="4">
              <ion-card class="foto-card">
                <img [src]="foto" alt="Vista previa de bebida" />
                <ion-button fill="solid" color="danger" expand="full" class="btn-quitar" (click)="eliminarFoto($index)">
                  Quitar
                </ion-button>
              </ion-card>
            </ion-col>
          }
        </ion-row>
      </ion-grid>
    }
  </div>

</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar class="ion-padding">
    <ion-button color="tertiary" expand="block" size="large" class="btn-guardar" (click)="guardarBebida()">
      GUARDAR BEBIDA
    </ion-button>
  </ion-toolbar>
</ion-footer>
