<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar-saffron">
    <ion-title class="text-russet title-bold">
      Lista de Espera
    </ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home-cliente" color="dark"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding bg-green">
  
  <div class="welcome-container fade-in">
    <div class="logo-wrapper">
      <img src="assets/icon/favicon.ico" class="spin-logo" alt="Logo Ristodeli" />
    </div>
    <h1 class="text-cream welcome-title typewriter-text"> </h1>
    <p class="text-cream welcome-subtitle" *ngIf="!solicitudEnviada">Ristodeli: Menos fila, más sabor</p>
    <p class="text-cream welcome-subtitle" *ngIf="solicitudEnviada">Esperando confirmación del Metre...</p>
  </div>

  <div class="actions-container fade-in">
    
    <ion-button *ngIf="!solicitudEnviada" 
                expand="block" shape="round" 
                class="action-btn qr-btn" 
                (click)="solicitarMesa()">
      <ion-icon slot="start" name="hand-right-outline"></ion-icon>
      Solicitar Mesa
    </ion-button>

    <div class="tarjeta-estado-espera" *ngIf="solicitudEnviada" style="text-align: center;">
      <ion-spinner name="crescent" color="warning"></ion-spinner>
      <p class="text-cream">Procesando solicitud...</p>
    </div>

    <ion-button expand="block" shape="round" 
    class="action-btn chart-btn" 
    (click)="irAMenuEncuestas()">
    <ion-icon slot="start" name="bar-chart-outline"></ion-icon>
    Ver Gráfico Encuestas
    </ion-button>

  </div>

</ion-content>
